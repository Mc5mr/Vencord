name: Publish Equicord binaries
on:
  push:
    branches: [equicord-updates]
    paths: [equicord-release.json]
permissions:
  contents: write
concurrency:
  group: equicord-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and prepare compiled assets
        run: python3 publish.py
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mc5mr Equicord $tag" --latest --notes 'Windows x64 GUI. Restore the compact Microphone Settings dialog on the lower microphone button with saved account presets and offline setup. Add StereoInstaller to Equicord settings using the same bundled Stereo Hub and remembered Stable/PTB/Canary selection. Allow following non-friends, retain voice access and full-room checks, and use native centered modal placement. Show only the double-check icon on the far-left read-all button. Fully quit Discord and close Stereo Hub before installing, then use Reinstall / Repair. Installation and public updates require no account or password. Discord Audio Collective credits and license are retained.'
      - name: Verify account-free download access
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          for file in release-files/*; do
            curl --fail --silent --show-error --location --head --retry 3 --max-time 60 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" > /dev/null
          done
      - name: Update public feed after successful publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Update public Equicord download feed'
          git push origin HEAD:equicord-updates
