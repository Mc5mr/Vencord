name: Publish Equicord binaries
on:
  push:
    branches: [equicord-updates]
    paths: [equicord-release.json]
permissions:
  contents: write
concurrency:
  group: equicord-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and prepare compiled assets
        run: python3 publish.py
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mc5mr Equicord $tag" --latest --notes 'Windows x64 GUI. Install and update without signing in. BetterMicrophone replaces the old microphone plugin and toolbar entry, preserves saved profiles and adds verified native stereo. Enable Stereo in BetterMicrophone and press Apply. Use a stereo input with Krisp and Echo Cancellation off. Native status reports compatibility; confirm actual left/right audio with a listener.'
      - name: Verify account-free download access
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          for file in release-files/*; do
            curl --fail --silent --show-error --location --head --retry 3 --max-time 60 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" > /dev/null
          done
      - name: Update public feed after successful publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Update public Equicord download feed'
          git push origin HEAD:equicord-updates

