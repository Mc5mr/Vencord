name: Publish Equicord binaries
on:
  push:
    branches: [equicord-updates]
    paths: [equicord-release.json]
permissions:
  contents: write
concurrency:
  group: equicord-public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and prepare compiled assets
        run: python3 publish.py
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          gh release create "$tag" release-files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mc5mr Equicord $tag" --latest --notes 'Windows x64 GUI. Suppress mention and typing popups in the DM or group chat currently open, dismiss matching popups when entering that conversation, and ignore bot mentions in private chats. Show one Mc5mr contributor badge with the complete ID-matched plugin list and display the edition author avatar directly in plugin settings. Refine the top toolbar and lower voice controls with twelve themed SVG icons, subtle depth and clear active states. Read all remains an icon-only double checkmark. Includes the integrated StereoInstaller page, centered Follow and Microphone Settings, grouped Voice Tools, immediate local friend previews, and permission-checked AutoUnmute from the previous release. Account-free client and GUI updates. Fully quit Discord and close Stereo Hub, open the installer, wait for Update is ready, then press Reinstall / Repair. Original upstream credits and licenses are retained.'
      - name: Verify account-free download access
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("equicord-release.json"))["tag_name"])')
          for file in release-files/*; do
            curl --fail --silent --show-error --location --head --retry 3 --max-time 60 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" > /dev/null
          done
      - name: Update public feed after successful publication
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'Update public Equicord download feed'
          git push origin HEAD:equicord-updates
